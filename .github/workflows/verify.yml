name: Verify publication snapshot
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  publication-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify file hashes, map registry and original oracle
        run: python tools/verify_publication.py
